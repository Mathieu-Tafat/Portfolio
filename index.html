<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>mathieu tafat™</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/splide.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/splide.min.js"></script>
  <script src="js/script.js" defer></script>
</head>
<body>

  <canvas id="bg-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;"></canvas>
  <canvas id="grain-canvas"></canvas>

  <div id="topbar">
    <div id="pdp"></div>
    <span id="pseudo">Mathieu</span>
    <span id="clock"></span>
  </div>

  <section class="splide">
    <div class="splide__track">
      <ul class="splide__list">
        <li class="splide__slide"><h1 class="titre isactive">Profil</h1></li>
        <li class="splide__slide"><h1 class="titre">Service Communication Université Rennes 2</h1></li>
        <li class="splide__slide"><h1 class="titre">Edition</h1></li>
        <li class="splide__slide"><h1 class="titre">Motion Design</h1></li>
        <li class="splide__slide"><h1 class="titre">Animations 3D</h1></li>
        <li class="splide__slide"><h1 class="titre">Jeux-vidéo</h1></li>
        <li class="splide__slide"><h1 class="titre">Peintures</h1></li>
      </ul>
    </div>
  </section>

  <div id="overlay">
    <div id="overlay-box">
      <div id="overlay-content"></div>
    </div>
  </div>

  <div id="overlay-hint">X</div>

</body>
</html>
